[workspace.package]
version = "26.10.0-b4"
authors = ["Zurich Instruments AG <info@zhinst.com>"]
edition = "2024"
publish = false
rust-version = "1.91"
description = "LabOne Q"
documentation = "README.md"
license = "Apache-2.0"

[workspace]
members = [
  "src/rust/*",

]

resolver = "2"

[workspace.dependencies]
# 3rd party crates
anyhow = "1.0"
approx = { version = "0.5.1", features = ["num-complex"] }
bitflags = "2"
bitvec = "1.0"
clap = "4.5.38"
criterion = "0.8"
# Exact pin so the transitive crossbeam-epoch (via rayon) stays at the version
# with the vulnerability fix: https://github.com/crossbeam-rs/crossbeam/pull/1276
# TODO (hs): get rid of this once rayon upgrades its dependency
crossbeam-epoch = "=0.9.20"
derive_more = "2.0.1"
indexmap = "2.9"
itertools = "0.14.0"
log = "0.4.27"
md5 = "0.8.0"
num-complex = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = [
  "abi3-py310",
  "generate-import-lib",
  "num-complex",
  "auto-initialize",
  "anyhow",
] }
pyo3-ffi = "0.29.0"
pyo3-log = "0.13.3"
rayon = "1.11.0"
regex = "1.11.3"
rustc-hash = "2.1.3"
serde = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3"
sha1 = "0.11.0"
smallvec = "1.15.1"
string-interner = "0.20.0"
capnp = "0.27"
capnpc = "0.27"
thiserror = "2.0"
uuid = { version = "1", default-features = false, features = ["serde"] }
twox-hash = { version = "2.1.2", default-features = false, features = [
  "xxhash3_128",
  "alloc",
] }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", default-features = false }
opentelemetry-otlp = { version = "0.33.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }

# 1st party
codegenerator = { path = "src/rust/codegenerator" }
interval-calculator = { path = "src/rust/interval-calculator" }
laboneq-dsl = { path = "src/rust/laboneq-dsl" }
laboneq-error = { path = "src/rust/laboneq-error" }
laboneq-ir = { path = "src/rust/laboneq-ir" }
laboneq-log = { path = "src/rust/laboneq-log" }
laboneq-scheduler = { path = "src/rust/laboneq-scheduler" }
laboneq-compiler-py = { path = "src/rust/laboneq-compiler-py" }
numeric-array = { path = "src/rust/numeric-array" }
codegenerator-py = { path = "src/rust/codegenerator-py" }
codegenerator-utils = { path = "src/rust/codegenerator-utils" }
laboneq-capnp = { path = "src/rust/laboneq-capnp" }
laboneq-capnp-build = { path = "src/rust/laboneq-capnp-build" }
laboneq-compiled-experiment-py = { path = "src/rust/laboneq-compiled-experiment-py" }
laboneq-experiment-py = { path = "src/rust/laboneq-experiment-py" }
laboneq-qccs-codegen-artifacts-py = { path = "src/rust/laboneq-qccs-codegen-artifacts-py" }
laboneq-common = { path = "src/rust/laboneq-common" }
laboneq-units = { path = "src/rust/laboneq-units" }
laboneq-py-utils = { path = "src/rust/laboneq-py-utils" }
laboneq-opentelemetry-python = { path = "src/rust/laboneq-opentelemetry-python" }
laboneq-qccs-backend = { path = "src/rust/laboneq-qccs-backend" }
laboneq-qccs-capnp = { path = "src/rust/laboneq-qccs-capnp" }
laboneq-tracing = { path = "src/rust/laboneq-tracing" }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("openqasm3"))',
] }
unused_qualifications = "deny"
explicit_outlives_requirements = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
missing_assert_message = "allow"               # todo: warn
multiple_crate_versions = "allow"
todo = "warn"
used_underscore_binding = "warn"
used_underscore_items = "warn"
verbose_file_reads = "warn"
