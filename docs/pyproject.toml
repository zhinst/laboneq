[project]
name = "laboneq-documentation"
version = "0.1.0"
description = "LabOne Q Documentation"
requires-python = ">=3.11"
dependencies = ["mkdocs-zhinst[zensical]>=0.0.51", "mkdocstrings-python>=2.0.9"]

[tool.uv.sources]
mkdocs-zhinst = { index = "zipypi" }

[[tool.uv.index]]
name = "zipypi"
url = "https://artifactory.zhinst.com/artifactory/api/pypi/ZIPyPI/simple"
explicit = true
